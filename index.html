<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Painel de Margem</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font:14px Arial;margin:0;background:#f4f6fb;color:#172033}header{background:#111a2e;color:#fff;padding:22px}main{max-width:1400px;margin:22px auto;padding:0 20px}.tabs button,.primary{padding:10px 15px;border:0;border-radius:8px;margin-right:6px;cursor:pointer}.primary,.active{background:#356ae6;color:#fff}.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:25px;font-weight:bold;margin-top:8px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:5px;min-width:170px}.field input,.field select{padding:9px;border:1px solid #d6ddeb;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #edf0f5;text-align:left}.muted{color:#748096}.hidden{display:none}.orders{display:flex;flex-wrap:wrap}.order{background:#fbfcff;border:1px solid #e1e6f0;border-radius:12px;padding:14px;margin:7px;width:225px}.order b{color:#356ae6}@media(max-width:800px){.grid{grid-template-columns:2fr 2fr}}</style><body><header><h2>Margem E-commerce</h2><span id="status">Nenhuma base carregada</span></header><main><nav class="tabs"><button class="active" onclick="tab('dash',this)">Vendas</button><button id="costBtn" disabled onclick="tab('costs',this)">Custos</button><button onclick="tab('up',this)">Importar bases</button></nav><section id="dash"><div class="card row"><div class="field"><label>Marketplace</label><select id="plat" onchange="render()"><option value="">Todos</option></select></div><div class="field"><label>Mês</label><select id="month" onchange="render()"><option value="">Todos</option></select></div><div class="field"><label>Ano</label><select id="year" onchange="render()"><option value="">Todos</option><option>2021</option><option>2022</option><option>2023</option><option>2024</option><option>2025</option><option>2026</option></select></div><div class="field"><label>Data inicial</label><input id="from" type="date" onchange="render()"></div><div class="field"><label>Data final</label><input id="to" type="date" onchange="render()"></div></div><div class="grid"><div class="card">Venda<div class="metric" id="sale">R$ 0</div></div><div class="card">PMC<div class="metric" id="cost">R$ 0</div></div><div class="card">Custos<div class="metric" id="fee">R$ 0</div></div><div class="card">Lucro líquido<div class="metric" id="profit">R$ 0</div></div></div><div class="card"><h3>Resumo por plataforma</h3><table><thead><tr><th>Plataforma</th><th>Pedidos</th><th>Vendas</th><th>Lucro líquido</th><th>Margem</th></tr></thead><tbody id="summary"></tbody></table></div><div class="card"><h3>Lucro real por pedido</h3><div id="orders" class="orders"></div></div></section><section id="costs" class="hidden"><div class="card"><h2>Custos por plataforma</h2><div class="row"><div class="field"><label>Marketplace</label><select id="cp"></select></div><div class="field"><label>Nome do custo</label><input id="cn" placeholder="Comissão, frete..."></div><div class="field"><label>Taxa (%)</label><input id="cr" type="number" step=".01"></div><div class="field"><label>Fixo/pedido</label><input id="cf" type="number" step=".01"></div><button class="primary" onclick="saveCost()">Salvar</button></div><table><tbody id="costRows"></tbody></table></div></section><section id="up" class="hidden"><div class="card"><h2>Importar bases</h2><p class="muted">Selecione a base Pluggto e a base PMC.</p><div class="row"><div class="field"><label>Vendas Pluggto</label><input id="sf" type="file" accept=".xlsx,.xls,.csv"></div><div class="field"><label>PMC</label><input id="pf" type="file" accept=".xlsx,.xls,.csv"></div><button class="primary" onclick="load()">Processar</button></div><p id="msg" class="muted"></p></div></section></main><script>
let data=[],pmc={},costs=JSON.parse(localStorage.getItem('costs')||'{}');const $=id=>document.getElementById(id),money=x=>(x||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),sku=x=>String(x||'').replace(/^\*/,'').replace(/-/g,'').trim().toUpperCase(),num=x=>{if(typeof x==='number')return x;let t=String(x??'').replace(/R\$\s?/g,'').trim();if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'').replace(',','.');else if(t.includes(','))t=t.replace(',','.');return parseFloat(t)||0};function key(r,n,i){let t=n+(i>1?' '+i:'');return Object.keys(r).find(k=>k.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim()===t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim())}function read(f){return f.arrayBuffer().then(b=>{let w=XLSX.read(b,{type:'array'});return XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''})})}function iso(v){let m=String(v||'').match(/(\d{2})-(\d{2})-(\d{4})\s+(\d{2}:\d{2}:\d{2})/);return m?`${m[3]}-${m[2]}-${m[1]}T${m[4]}`:''}function tab(id,b){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function load(){let[s,p]=await Promise.all([read($('sf').files[0]),read($('pf').files[0])]);pmc={};p.forEach(r=>{let ck=Object.keys(r).find(k=>k.toLowerCase().includes('código')||k.toLowerCase().includes('codigo')),pk=Object.keys(r).find(k=>k.trim().toUpperCase()==='PMC');if(ck)pmc[sku(r[ck])]=num(r[pk])});data=[];s.forEach(r=>{let rawOrder=r['ID do pedido']||r['Id do pedido']||'',external=r['IDs externos']||r['IDs Externos']||r['Ids externos']||'';let order=rawOrder.includes(',')?rawOrder.split(',')[0].trim():(rawOrder||external||'Sem pedido'),date=iso(r['Criado em']);for(let i=1;i<=15;i++){let a=sku(r[key(r,'Item Sku',i)]),v=sku(r[key(r,'Item Sku Variação',i)]||r[key(r,'Item Sku Variacao',i)]);let z=/^\d{11}[A-Z]$/.test(a)?a:v;if(!z)continue;let q=num(r[key(r,'Item Quantidade',i)]),pr=num(r[key(r,'Item Preço',i)]||r[key(r,'Item Preco',i)]);data.push({order,date,platform:r.Canal||'Sem plataforma',sku:z,qty:q,sale:q*pr,pmc:pmc[z]||pmc[z.replace(/^0+/,'')]||0})}});let ps=[...new Set(data.map(x=>x.platform))].sort();$('plat').innerHTML='<option value="">Todos</option>'+ps.map(x=>`<option>${x}</option>`);$('cp').innerHTML=ps.map(x=>`<option>${x}</option>`);$('costBtn').disabled=false;$('status').textContent=data.length.toLocaleString('pt-BR')+' itens carregados';$('msg').textContent=`${s.length.toLocaleString('pt-BR')} pedidos e ${Object.keys(pmc).length.toLocaleString('pt-BR')} SKUs PMC processados.`;render()}function platformCost(p){return Object.values(costs).filter(x=>x.platform===p).reduce((a,x)=>({rate:a.rate+x.rate,fix:a.fix+x.fix}),{rate:0,fix:0})}function render(){let m=+$('month').value,y=+$('year').value,st=$('from').value,en=$('to').value,p=$('plat').value,a=data.filter(x=>(!p||x.platform===p)&&(!m||new Date(x.date).getMonth()+1===m)&&(!y||new Date(x.date).getFullYear()===y)&&(!st||x.date>=st)&&(!en||x.date<=en+'T23:59:59'));let S=a.reduce((z,x)=>z+x.sale,0),M=a.reduce((z,x)=>z+x.pmc*x.qty,0),F=a.reduce((z,x)=>{let c=platformCost(x.platform);return z+x.sale*c.rate/100+c.fix},0);$('sale').textContent=money(S);$('cost').textContent=money(M);$('fee').textContent=money(F);$('profit').textContent=money(S-M-F);let g={};a.forEach(x=>(g[x.order]??=[]).push(x));$('orders').innerHTML=Object.entries(g).map(([o,v])=>{let s=v.reduce((z,x)=>z+x.sale,0),m=v.reduce((z,x)=>z+x.pmc*x.qty,0),c=platformCost(v[0].platform),f=s-m-s*c.rate/100-c.fix;return `<div class="order"><b>${o}</b><br>${v[0].platform}<br>${v[0].date.replace('T',' ')}<hr>Venda: ${money(s)}<br>PMC: ${money(m)}<br>Custos: ${money(s*c.rate/100+c.fix)}<br><b>Lucro: ${money(f)}</b><br>Margem: ${s?(f/s*100).toFixed(1):0}%</div>`}).join('')||'<p>Nenhum pedido encontrado.</p>'}function saveCost(){let p=$('cp').value,n=$('cn').value||'Custo';costs[p+'|'+n]={platform:p,name:n,rate:num($('cr').value),fix:num($('cf').value)};localStorage.setItem('costs',JSON.stringify(costs));$('costRows').innerHTML=Object.values(costs).map(x=>`<tr><td>${x.platform}</td><td>${x.name}</td><td>${x.rate}%</td><td>${money(x.fix)}</td></tr>`).join('');render()}for(let i=1;i<=12;i++)$('month').innerHTML+=`<option value="${i}">${i}</option>`;render();</script><script>
(function(){
 function draw(){let e=document.getElementById('costRows');if(!e)return;e.innerHTML=Object.entries(costs).map(([k,x])=>`<tr><td>${x.platform}</td><td>${x.name}</td><td>${x.rate}%</td><td>${money(x.fix)}</td><td><button onclick="editSavedCost('${k}')">Editar</button> <button onclick="deleteSavedCost('${k}')">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhum custo cadastrado.</td></tr>'}
 window.editSavedCost=function(k){let x=costs[k];if(!x)return;$('cp').value=x.platform;$('cn').value=x.name;$('cr').value=x.rate;$('cf').value=x.fix;delete costs[k];localStorage.setItem('costs',JSON.stringify(costs));draw()};window.deleteSavedCost=function(k){if(confirm('Excluir este custo?')){delete costs[k];localStorage.setItem('costs',JSON.stringify(costs));draw();render()}};let old=window.saveCost;window.saveCost=function(){old();draw()};draw()
})();
</script><script>async function loadApi(){let st=document.getElementById('from').value||new Date().toISOString().slice(0,10),en=document.getElementById('to').value||new Date().toISOString().slice(0,10),u='https://pluggto-proxy.guilhermepaulino-wapssolutions.workers.dev/orders?start='+st+'&end='+en;try{let r=await fetch(u),j=await r.json(),rows=(j.result||j.orders||j.data||[]).map(x=>x.Order||x);data=[];rows.forEach((q,n)=>{let o=(q.original_id||q.external||q.id||q.order_id||('Pedido-'+n)).toString().split(',')[0].trim(),d=iso(q['Criado em']||q.created_at||'');(q.items||[]).forEach(i=>{let z=sku(i.variation?.sku||i.sku||i.SKU);if(z)data.push({order:o,date:d,platform:q.Canal||q.channel||q.marketplace||'Sem plataforma',sku:z,qty:num(i.quantity||i.qty),sale:num(i.total||i.price)*num(i.quantity||i.qty),pmc:pmc[z]||0})})});$('status').textContent=data.length+' itens carregados da API';render()}catch(e){$('msg').textContent='Erro na API: '+e.message}}</script><script>
(function(){function refresh(){if(typeof loadApi==='function')loadApi()}window.addEventListener('load',()=>{refresh();setInterval(refresh,300000)});['from','to'].forEach(id=>document.getElementById(id)?.addEventListener('change',refresh))})();
</script><script>
(function(){let up=document.getElementById('up');if(!up)return;let sf=document.getElementById('sf');if(sf){let f=sf.closest('.field');if(f)f.remove()}let old=up.querySelector('p.muted');if(old)old.textContent='Importe uma planilha contendo somente as colunas SKU e PMC.';let box=document.createElement('div');box.className='card';box.innerHTML='<h3>SKUs sem PMC</h3><p class="muted">Lista atualizada com base nos pedidos carregados pela API.</p><button class="primary" onclick="exportPMC()">Exportar todos SKU/PMC</button><table><thead><tr><th>SKU</th><th>Status</th></tr></thead><tbody id="missingPMC"></tbody></table>';up.appendChild(box);window.exportPMC=function(){let rows=['SKU,PMC',...Object.entries(pmc).map(([k,v])=>`${k},${v??''}`)];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download='sku-pmc.csv';a.click()};let oldRender=window.render;window.render=function(){oldRender();let e=document.getElementById('missingPMC');if(e){let m=[...new Set(data.filter(x=>!x.pmc).map(x=>x.sku))].sort();e.innerHTML=m.map(x=>`<tr><td>${x}</td><td>PMC não cadastrado</td></tr>`).join('')||'<tr><td colspan="2">Nenhum SKU sem PMC.</td></tr>'}}})();
</script></body></html>
